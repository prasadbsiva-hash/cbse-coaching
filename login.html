<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title">Login - EduQuest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="app-name-header">EduQuest</h1>
        <nav>
            <ul id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li id="login-link"><a href="login.html">Login</a></li>
                <li id="signup-link"><a href="signup.html">Sign Up</a></li>
                <li id="logout-link" class="hidden"><button id="logout-button">Logout</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Login</h2>
        <form id="login-form">
            <div>
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div>
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 <span id="app-name-footer">EduQuest</span></p>
    </footer>
    <script src="firebase-init.js" type="module"></script>
    <script src="auth.js" type="module"></script>
    <script src="script.js" type="module"></script>
</body>
</html>
